[project]

name = "cv_adjuster"
version = "0.1.0"
description = "A tool for adjusting resume contents to specific job offers."
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]",
    "docker",
    "python-dotenv",
    "pydantic-ai",
    "pydantic-ai-harness",
]

[project.scripts]
process-achievements = "scripts.process_achievements:main"
ac-mdify = "scripts.process_achievements:achievements_to_md"
ac-summarize = "scripts.process_achievements:md_to_summary"
cv-adjust = "scripts.cv_adjustement:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["achievements", "cv_adjustement", "models", "sandbox"]

[tool.setuptools.packages.find]
where = ["src"]
